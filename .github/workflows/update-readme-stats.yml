name: Update README Stats

on:
  schedule:
    - cron: "0 3 * * *"  # Runs daily at 3 AM UTC
  workflow_dispatch:  # Allow manual trigger

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: username=Vlasovets&theme=buefy&show_icons=true&hide_rank=true&cache_seconds=7200
          path: assets/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: username=Vlasovets&layout=compact&langs_count=8&hide=html,css,scss,jupyter notebook
          path: assets/languages.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # The action exits 0 even when the API call fails and writes an error card instead
      - name: Check cards are valid
        run: |
          if grep -l "Something went wrong" assets/*.svg; then
            echo "::error::Card generation failed; not committing error cards"
            exit 1
          fi

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "Update README stats [skip ci]" || exit 0
          git push
